version: "3.9"
services:
  lifelog-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - LIFELOG_ENV=production
      - LIFELOG_DB_PATH=/app/db/lifelog.db
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/logs:/app/logs
      - lifelog-db:/app/db
      - chroma-data:/app/data/chromadb
      - chroma-cache:/root/.cache/chroma
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  lifelog-db:
  chroma-data:
  chroma-cache:
  hf-cache: